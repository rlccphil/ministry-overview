<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Fulfill our Mission</title>

  <link rel="stylesheet" href="styles.css">
  <style>
    .rlcc-brand {
      background: #365233;
      padding: calc(env(safe-area-inset-top, 0px) + 12px) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .rlcc-brand img { height: 34px; width: auto; max-width: 100%; display: block; }
  </style>

<body>

    <img src="icons/rlcc-logo-white.png" alt="Real Life Christian Communities">

    <div class="loading"><div class="spinner"></div>Loading the pathway…</div>

  <script src="client.js"></script>

  <script>

      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      });
    }
