  <style>
    :root {
      --green: #365233; --green-d: #27402a; --ink: #1f2b22; --muted: #66726a;
      --bg: #f7f4ee; --card: #ffffff; --line: #e6e0d3;
      --rel: #b4654a; --phy: #5b8a67; --men: #c39a3a; --spi: #7a64a8;

    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body { display: flex; flex-direction: column; font-family: var(--sans); background: var(--bg); color: var(--ink); line-height: 1.5; }
    h1, h2, h3 { font-family: var(--serif); font-weight: 700; line-height: 1.2; margin: 0; }
    p { margin: 0; }
    button { font: inherit; cursor: pointer; }
    :focus-visible { outline: 3px solid #8fb58a; outline-offset: 2px; }

    /* Header + steps */
    .bar { background: var(--green); color: #fff; padding: env(safe-area-inset-top, 0px) max(14px, env(safe-area-inset-right, 0px)) 0 max(14px, env(safe-area-inset-left, 0px)); }
    .bar-inner { min-height: 50px; display: flex; align-items: center; gap: 12px; padding: 8px 0; }
    .logo { height: 26px; width: auto; display: block; }
    .divider { width: 1px; height: 22px; background: rgba(255,255,255,.35); }
    .title { font-weight: 700; font-size: 17px; letter-spacing: .02em; }
    .tagline { font-size: 13px; color: rgba(255,255,255,.78); }
    .spacer { flex: 1 1 auto; }
    .burger { display: none; width: 44px; height: 44px; padding: 0; border: 1px solid rgba(255,255,255,.4); border-radius: 10px; background: transparent; cursor: pointer; flex-direction: column; justify-content: center; align-items: center; gap: 5px; }
    .burger span { display: block; width: 22px; height: 2px; background: #fff; border-radius: 2px; }
    .burger:focus-visible { outline: 3px solid #fff; outline-offset: 2px; }
    .crumb, .scrim, .menu-close { display: none; }
    .steps { background: #fff; border-bottom: 1px solid var(--line); display: grid; grid-template-columns: repeat(8, 1fr); padding: 0 max(2px, env(safe-area-inset-left, 0px)); }
    .step { background: none; border: 0; border-bottom: 3px solid transparent; padding: 10px 2px 8px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 12.5px; font-weight: 600; line-height: 1.2; text-align: center; }
    .step .n { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid #c9cfc6; display: grid; place-items: center; font-size: 12px; background: #fff; }
    .step.done .n { background: var(--green); border-color: var(--green); color: #fff; }
    .step[aria-current="step"] { color: var(--green); border-bottom-color: var(--green); }
    .step[aria-current="step"] .n { border-color: var(--green); }

    .stage { flex: 1 1 auto; min-height: 0; position: relative; }
    .pane { display: none; position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
    .pane.active { display: block; }
    .pane.fr.active { display: flex; flex-direction: column; overflow: hidden; }
    .wrap { max-width: 760px; margin: 0 auto; padding: 26px 18px calc(env(safe-area-inset-bottom, 0px) + 40px); }

    /* Shared bits */
    .eyebrow { font-size: 11.5px; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
    .card { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 24px; box-shadow: 0 8px 30px rgba(54,82,51,.06); }
    .btn { border: 0; border-radius: 999px; padding: 12px 22px; font-weight: 600; font-size: 15px; background: var(--green); color: #fff; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
    .btn:hover { background: var(--green-d); }
    .btn.ghost { background: #fff; color: var(--green); border: 1.5px solid var(--green); }
    .btn.ghost:hover { background: #eef3ec; }
    .btn[disabled] { opacity: .4; cursor: not-allowed; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
    .lead { color: #46534a; font-size: 16.5px; }
    .note { font-size: 13px; color: var(--muted); }
    .link { background: none; border: 0; padding: 0; color: var(--green); text-decoration: underline; font-size: 13px; }

    /* Check-in */
    .greet { margin: 8px 0 6px; font-size: clamp(30px, 6vw, 42px); }
    .field { display: grid; gap: 6px; margin: 18px 0 4px; max-width: 420px; }
    .field label { font-weight: 600; font-size: 14px; }
    .field input { font: inherit; padding: 11px 13px; border: 1px solid #d3cdbf; border-radius: 12px; background: #fff; }
    .verse { margin-top: 18px; padding-left: 14px; border-left: 3px solid #c9d8c5; font-family: var(--serif); font-style: italic; color: #4a574d; }
    .verse span { display: block; font-style: normal; font-family: var(--sans); font-size: 12.5px; color: var(--muted); margin-top: 2px; }
    .progress { display: flex; gap: 6px; margin-bottom: 18px; }
    .progress i { flex: 1; height: 5px; border-radius: 4px; background: #e2dccd; }
    .progress i.on { background: var(--green); }
    .q { border: 0; padding: 0; margin: 0 0 22px; }
    .q legend { padding: 0; font-weight: 600; font-size: 16px; margin-bottom: 10px; }
    .scale { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
    .scale { position: relative; }
    .scale input { position: absolute; opacity: 0; pointer-events: none; }
    .scale label { display: grid; place-items: center; text-align: center; min-height: 46px; padding: 6px 2px; font-size: 12px; font-weight: 600; line-height: 1.15; border: 1.5px solid #d9d3c5; border-radius: 12px; background: #fff; color: #4a574d; cursor: pointer; }
    .scale input:checked + label { background: var(--dc, var(--green)); border-color: var(--dc, var(--green)); color: #fff; }
    .scale input:focus-visible + label { outline: 3px solid #8fb58a; outline-offset: 2px; }
    .nav { display: flex; justify-content: space-between; gap: 10px; margin-top: 8px; }

    .hero { display: grid; gap: 20px; grid-template-columns: 1fr; align-items: center; }
    @media (min-width: 680px) { .hero { grid-template-columns: 1.1fr .9fr; } }
    .score-big { font-family: var(--serif); font-size: 64px; line-height: 1; }
    .score-big small { font-size: 20px; color: var(--muted); font-family: var(--sans); }
    .pill { display: inline-block; padding: 4px 12px; border-radius: 999px; color: #fff; font-size: 13px; font-weight: 700; }
    canvas.radar { width: 100%; max-width: 420px; aspect-ratio: 1; display: block; margin: 0 auto; }
    .doms { display: grid; gap: 12px; margin-top: 18px; grid-template-columns: 1fr; }
    @media (min-width: 680px) { .doms { grid-template-columns: 1fr 1fr; } }
    .dom { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 16px; }
    .dom h3 { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-family: var(--sans); display: flex; align-items: center; gap: 8px; }
    .dom h3 b { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
    .dom .num { font-family: var(--serif); font-size: 34px; margin: 4px 0; }
    .dom .num small { font-size: 14px; color: var(--muted); font-family: var(--sans); }
    .bar-track { height: 7px; border-radius: 4px; background: #ece7da; overflow: hidden; }
    .bar-fill { height: 100%; border-radius: 4px; }
    .dom p { font-size: 14px; color: #46534a; margin-top: 10px; }
    .block { margin-top: 22px; }
    .block h2 { font-size: 22px; margin-bottom: 8px; }
    .block ul { margin: 6px 0 0; padding-left: 20px; }
    .block li { margin: 4px 0; }
    .trend { font-size: 14px; color: var(--muted); margin-top: 8px; }

    /* Care */
    .rec { border-left: 6px solid var(--green); }
    .rec.strong { border-left-color: var(--rel); background: #fffaf7; }
    .rec.suggested { border-left-color: var(--men); background: #fffdf6; }
    .rec h2 { font-size: 26px; margin: 6px 0 10px; }
    .safety { margin-top: 16px; padding: 12px 14px; background: #f1f5ef; border-radius: 12px; font-size: 13.5px; color: #3c4a3f; }
    .embed { margin-top: 20px; border: 1px solid var(--line); border-radius: 16px; overflow: hidden; background: #fff; position: relative; height: max(640px, 82vh); }
    .embed iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }

    /* iframe panes */
    .tool { display: flex; align-items: center; gap: 8px; padding: 8px 14px; background: #fff; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
    .tool .sp { flex: 1; }
    .tbtn { font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 8px; border: 1px solid #cfd8cb; background: #fff; color: var(--green); text-decoration: none; }
    .tbtn:hover { background: #eef3ec; }
    .tbtn.go { background: var(--green); color: #fff; border-color: var(--green); }
    .tbtn.extra { border-color: #7a64a8; color: #5a468a; }
    .tbtn.extra:hover { background: #f4f0fa; }
    .seg { display: inline-flex; border: 1px solid #cfd8cb; border-radius: 10px; overflow: hidden; }
    .seg button { border: 0; background: #fff; padding: 7px 14px; font: 600 13px var(--sans); color: var(--green); cursor: pointer; }
    .seg button + button { border-left: 1px solid #cfd8cb; }
    .seg button[aria-pressed="true"] { background: var(--green); color: #fff; }
    .fview { position: absolute; inset: 0; }
    .fwrap { position: relative; flex: 1 1 auto; min-height: 0; }
    .fwrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; background: #fff; }
    .fstatus { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; background: var(--bg); text-align: center; padding: 24px; z-index: 2; }
    .fstatus[hidden] { display: none; }
    .spinner { width: 28px; height: 28px; border-radius: 50%; border: 3px solid #d5dfd2; border-top-color: var(--green); animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
    .toast { position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom, 0px) + 20px); transform: translateX(-50%); background: #1f2b22; color: #fff; padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
    .toast.show { opacity: 1; }
    /* CHRIST Stages */
    .cs-legend { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    .cs-legend li { display: flex; gap: 12px; align-items: center; }
    .cs-dot { flex: 0 0 auto; width: 34px; height: 34px; border-radius: 50%; color: #fff; display: grid; place-items: center; font: 700 14px var(--serif); }
    .cs-rb { margin: 4px 0 22px; padding: 14px 16px; background: #fffaf6; border: 1.5px dashed #d9b8a8; border-radius: 14px; }
    .cs-dims { display: grid; gap: 12px; }
    .cs-dim { background: #fff; border: 1px solid var(--line); border-radius: 16px; padding: 4px 16px 16px; }
    .cs-dim > summary { list-style: none; cursor: pointer; display: flex; align-items: center; gap: 12px; padding: 12px 0; }
    .cs-dim > summary::-webkit-details-marker { display: none; }
    .cs-sum { flex: 1; display: grid; gap: 2px; }
    .cs-score { font: 700 28px var(--serif); }
    .cs-dim p { margin: 8px 0 0; font-size: 15px; color: #3c4a3f; }
    .cs-dim ul { margin: 6px 0 0; padding-left: 20px; font-size: 15px; color: #3c4a3f; }
    .cs-h { font-size: 11.5px !important; letter-spacing: .12em; text-transform: uppercase; color: var(--muted) !important; font-weight: 700; margin-top: 14px !important; }
    .cs-wall { border-left: 6px solid #5b5b5b; }
    .cs-wall p { margin-top: 8px; } .cs-wall ul { margin: 6px 0 0; padding-left: 20px; }
    /* Welcome */

    .w-ms li { display: flex; gap: 12px; align-items: flex-start; }
    .w-ms .cs-dot { margin-top: 2px; }
    .w-how { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
    .w-how button { width: 100%; text-align: left; display: flex; gap: 14px; align-items: flex-start; padding: 12px 14px; border: 1px solid var(--line); border-radius: 14px; background: #fff; color: inherit; }
    .w-how button:hover { background: #f1f5ef; }
    .w-how .n { flex: 0 0 auto; width: 28px; height: 28px; border-radius: 50%; background: var(--green); color: #fff; display: grid; place-items: center; font-size: 13px; font-weight: 700; }
    .w-how strong { display: block; }
    .w-how .note { display: block; margin-top: 2px; }
    .w-tips { margin: 6px 0 0; padding-left: 20px; } .w-tips li { margin: 8px 0; }
    .w-join { border-left: 6px solid #7a64a8; background: #fbf9fe; }
    .w-join h2 { font-size: 24px; margin: 4px 0 8px; }
    .w-join p { margin-bottom: 10px; }

    @media (max-width: 860px) {
      .burger { display: flex; }
      .tagline { display: none; }
      .crumb { display: flex; align-items: center; gap: 10px; background: #fff; border-bottom: 1px solid var(--line); padding: 9px max(16px, env(safe-area-inset-left, 0px)); font-size: 13px; color: var(--muted); }
      .crumb strong { color: var(--ink); font-size: 15px; }
      .crumb .pos { margin-left: auto; }
      .steps { position: fixed; top: 0; right: 0; bottom: 0; width: min(84vw, 330px); z-index: 40; display: flex; flex-direction: column; align-items: stretch; padding: calc(env(safe-area-inset-top, 0px) + 10px) 14px calc(env(safe-area-inset-bottom, 0px) + 20px); border: 0; box-shadow: -12px 0 32px rgba(0,0,0,.18); overflow-y: auto; transform: translateX(105%); visibility: hidden; transition: transform .25s ease, visibility 0s linear .25s; }
      body.menu-open .steps { transform: none; visibility: visible; transition: transform .25s ease, visibility 0s; }
      .menu-close { display: block; align-self: flex-end; width: 44px; height: 44px; border: 0; background: none; font-size: 32px; line-height: 1; color: var(--green); cursor: pointer; }
      .step { flex-direction: row; justify-content: flex-start; text-align: left; gap: 14px; padding: 14px 12px; font-size: 16px; border-bottom: 1px solid var(--line); border-left: 4px solid transparent; }
      .step[aria-current="step"] { border-bottom-color: var(--line); border-left-color: var(--green); background: #f1f5ef; }
      .scrim { position: fixed; inset: 0; background: rgba(20,30,22,.45); z-index: 30; }
      body.menu-open .scrim { display: block; }
      body.menu-open { overflow: hidden; }
    }
    @media (prefers-reduced-motion: reduce) { .steps { transition: none !important; } }
    @media (max-width: 520px) { .divider { display: none; } .card { padding: 18px; } .score-big { font-size: 54px; } }
  </style>

    function compute(answers) {
      var scores = DOMAINS.map(function (d, di) {
        var sum = 0; for (var i = 0; i < 5; i++) sum += answers[di * 5 + i];

    }

    /* ---------- Radar chart ---------- */
    function drawRadar(canvas, px, scores, bg) {
      canvas.width = px; canvas.height = px;
      var c = canvas.getContext('2d'), cx = px / 2, cy = px / 2, R = px * 0.29;
      if (bg) { c.fillStyle = bg; c.fillRect(0, 0, px, px); } else c.clearRect(0, 0, px, px);
      var ang = [-90, 0, 90, 180].map(function (a) { return a * Math.PI / 180; });
      function pt(i, f) { return [cx + Math.cos(ang[i]) * R * f, cy + Math.sin(ang[i]) * R * f]; }
      c.lineWidth = Math.max(1, px / 600); c.strokeStyle = '#d6d0c2'; c.setLineDash([px / 120, px / 120]);
      [0.25, 0.5, 0.75, 1].forEach(function (f) { c.beginPath(); for (var i = 0; i < 4; i++) { var p = pt(i, f); i ? c.lineTo(p[0], p[1]) : c.moveTo(p[0], p[1]); } c.closePath(); c.stroke(); });
      c.setLineDash([]); for (var i = 0; i < 4; i++) { var e = pt(i, 1); c.beginPath(); c.moveTo(cx, cy); c.lineTo(e[0], e[1]); c.stroke(); }
      c.beginPath(); for (i = 0; i < 4; i++) { var q = pt(i, Math.max(scores[i], 4) / 100); i ? c.lineTo(q[0], q[1]) : c.moveTo(q[0], q[1]); }
      c.closePath(); c.fillStyle = 'rgba(54,82,51,.20)'; c.fill(); c.lineWidth = px / 220; c.strokeStyle = '#365233'; c.stroke();
      for (i = 0; i < 4; i++) { var d = pt(i, Math.max(scores[i], 4) / 100); c.beginPath(); c.arc(d[0], d[1], px / 90, 0, 7); c.fillStyle = DOMAINS[i].color; c.fill(); }
      var f1 = Math.round(px * 0.040), f2 = Math.round(px * 0.034);
      function label(i, x, y1, y2, align) {
        c.textAlign = align; c.font = '600 ' + f1 + 'px system-ui, sans-serif'; c.fillStyle = '#1f2b22'; c.fillText(DOMAINS[i].name, x, y1);
        c.font = '700 ' + f2 + 'px system-ui, sans-serif'; c.fillStyle = DOMAINS[i].color; c.fillText(String(scores[i]), x, y2);
      }
      label(0, cx, px * 0.105, px * 0.15, 'center');
      label(1, cx + R + px * 0.04, cy - px * 0.005, cy + px * 0.04, 'left');
      label(2, cx, cy + R + px * 0.075, cy + R + px * 0.12, 'center');
      label(3, cx - R - px * 0.04, cy - px * 0.005, cy + px * 0.04, 'right');
    }

    /* ---------- PDF ---------- */
    function pdfSafe(s) { return String(s).replace(/[\u2018\u2019]/g, "'").replace(/[\u201C\u201D]/g, '"').replace(/[\u2013\u2014]/g, '-').replace(/\u00b7/g, '-').replace(/\u2026/g, '...'); }
    function hex(h) { return [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)]; }
    function loadImg(src) { return new Promise(function (res, rej) { var i = new Image(); i.onload = function () { var c = document.createElement('canvas'); c.width = i.naturalWidth; c.height = i.naturalHeight; c.getContext('2d').drawImage(i, 0, 0); res({ data: c.toDataURL('image/png'), w: c.width, h: c.height }); }; i.onerror = rej; i.src = src; }); }

          var lines = doc.splitTextToSize(pdfSafe(text), W - 2 * M), lh = size * 0.42;

        y = 46; doc.setFont('times', 'bold'); doc.setFontSize(22); doc.setTextColor(31, 43, 34); doc.text('Daily RPMS Check-in', M, y);

      burger.setAttribute('aria-expanded', open ? 'true' : 'false');
      burger.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
      if (open) { var cur = $('.step[aria-current="step"]') || $('.step'); if (cur) setTimeout(function () { cur.focus(); }, 60); }
      else if (returnFocus) burger.focus();
    }
    burger.addEventListener('click', function () { setMenu(!document.body.classList.contains('menu-open'), true); });
    menuClose.addEventListener('click', function () { setMenu(false, true); });
    $('#scrim').addEventListener('click', function () { setMenu(false, true); });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && document.body.classList.contains('menu-open')) setMenu(false, true); });
    window.addEventListener('resize', function () { if (window.innerWidth > 860 && document.body.classList.contains('menu-open')) setMenu(false, false); });

    function go(step, auto) {
      step = ALIAS[step] || step;
      if (ORDER.indexOf(step) < 0) step = 'welcome';
      document.querySelectorAll('.pane').forEach(function (p) { p.classList.toggle('active', p.id === 'pane-' + step); });
      document.querySelectorAll('.step').forEach(function (b) { if (b.dataset.step === step) b.setAttribute('aria-current', 'step'); else b.removeAttribute('aria-current'); });
      if (step === 'welcome') renderWelcome();
      if (step === 'circles' && !frames.circles) buildFramePane('circles', CONFIG.CIRCLES_URL, 'checkin', 'Next: Check-in \u2192', 'Circles', CONFIG.JOURNAL_URL ? [{ label: 'Mindful Journal', url: CONFIG.JOURNAL_URL }] : []);
      if (step === 'care') renderCare();
      if (step === 'course' && !frames.course) buildFramePane('course', CONFIG.LEARN_URL, 'calling', 'Next: Calling \u2192', 'Course');
      if (step === 'calling' && !frames.calling) buildFramePane('calling', CONFIG.CALLING_URL, 'commission', 'Next: Commission \u2192', 'Calling');
      if (step === 'commission' && !frames.commission) {
        var ct = [];
        if (CONFIG.WISE_URL) ct.push({ key: 'wise', label: 'Wise Planning', url: CONFIG.WISE_URL });
        if (CONFIG.CARELOG_URL) ct.push({ key: 'carelog', label: 'Personal Care Log', url: CONFIG.CARELOG_URL });
        if (ct.length) buildMultiPane('commission', ct); else buildFramePane('commission', '', null, '', 'Commission');
      }
      if (!auto) {
        if (step !== 'checkin' && step !== 'christ') journey.visited[step] = true;
        if (step !== 'welcome') journey.last = step;
        save(JKEY, journey);
      }
      renderStepper();
      $('#crumb').innerHTML = '<strong>' + esc(STEP_LABEL[step]) + '</strong><span class="pos">' + (ORDER.indexOf(step) + 1) + ' of ' + ORDER.length + '</span>';
      if (document.body.classList.contains('menu-open')) setMenu(false, true);
      if (location.hash !== '#' + step) history.replaceState(null, '', '#' + step);
      var p = $('#pane-' + step); if (p) p.scrollTop = 0;
    }
    document.querySelectorAll('.step').forEach(function (b) { b.addEventListener('click', function () { go(b.dataset.step); }); });
    window.addEventListener('hashchange', function () { go(location.hash.slice(1)); });

    /* ---------- Start ---------- */
    renderIntro(); csRenderIntro(); renderStepper();
    go(location.hash.slice(1) || 'welcome', true);
    if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  })();
  </script>
</body>
</html>
